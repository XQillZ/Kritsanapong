<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: Tahoma, sans-serif; font-size: 14px; fill: #333; }
    .title { font-size: 14px; text-transform: uppercase; fill: #555; }
    .box { fill: none; stroke: #333; stroke-width: 1; }
    .line { stroke: #333; stroke-width: 1; fill: none; }
    .arrow { fill: #333; }
  </style>

  <!-- USERS Table -->
  <text x="100" y="50" class="title">USERS</text>
  <rect x="100" y="60" width="400" height="30" class="box"/>
  <line x1="200" y1="60" x2="200" y2="90" class="line"/>
  <line x1="300" y1="60" x2="300" y2="90" class="line"/>
  <line x1="400" y1="60" x2="400" y2="90" class="line"/>
  
  <text x="125" y="80">user_id</text>
  <text x="230" y="80">email</text>
  <text x="320" y="80">username</text>
  <text x="410" y="80">total_score</text>

  <!-- QUESTIONS Table -->
  <text x="100" y="150" class="title">QUESTIONS</text>
  <rect x="100" y="160" width="600" height="30" class="box"/>
  <line x1="200" y1="160" x2="200" y2="190" class="line"/>
  <line x1="300" y1="160" x2="300" y2="190" class="line"/>
  <line x1="400" y1="160" x2="400" y2="190" class="line"/>
  <line x1="500" y1="160" x2="500" y2="190" class="line"/>
  <line x1="600" y1="160" x2="600" y2="190" class="line"/>

  <text x="115" y="180">question_id</text>
  <text x="220" y="180">category</text>
  <text x="320" y="180">difficulty</text>
  <text x="435" y="180">text</text>
  <text x="530" y="180">answer</text>
  <text x="615" y="180">image_url</text>

  <!-- USER_ANSWERS Table (Relation) -->
  <text x="100" y="250" class="title">USER_ANSWERS</text>
  <rect x="100" y="260" width="500" height="30" class="box"/>
  <line x1="200" y1="260" x2="200" y2="290" class="line"/>
  <line x1="300" y1="260" x2="300" y2="290" class="line"/>
  <line x1="400" y1="260" x2="400" y2="290" class="line"/>
  <line x1="500" y1="260" x2="500" y2="290" class="line"/>

  <text x="120" y="280">answer_id</text>
  <text x="225" y="280">user_id</text>
  <text x="315" y="280">question_id</text>
  <text x="420" y="280">is_correct</text>
  <text x="515" y="280">answered_at</text>

  <!-- Arrows -->
  <!-- USER_ANSWERS.user_id -> USERS.user_id -->
  <path d="M 250 290 L 250 320 L 60 320 L 60 110 L 150 110 L 150 90" class="line"/>
  <polygon points="145,100 155,100 150,90" class="arrow"/>

  <!-- USER_ANSWERS.question_id -> QUESTIONS.question_id -->
  <path d="M 350 290 L 350 340 L 80 340 L 80 210 L 150 210 L 150 190" class="line"/>
  <polygon points="145,200 155,200 150,190" class="arrow"/>

</svg>